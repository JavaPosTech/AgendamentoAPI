services:
  agendamentoapi:
    container_name: AgendamentoAPI
    build: .
    image: agendamentoapi:1.0.0

    ports:
      - "9027:9027"

    environment:
      TZ: America/Sao_Paulo

      SPRING_PROFILES_ACTIVE: prod

      DATABASE_IP: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-postgres}
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?defina DATABASE_PASSWORD no arquivo .env}

      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no arquivo .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}

    volumes:
      - ./logs:/app/logs

    restart: always

    networks:
      - shared-net

networks:
  shared-net:
    external: true
